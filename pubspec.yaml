name: portfolio
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  dio: ^5.8.0+1
  url_launcher: ^6.3.1
  safe_device: ^1.2.1
  html: ^0.15.6
  image_picker: ^1.1.2
  flutter_screenutil: ^5.9.3
  get_it: ^8.0.3
  internet_connection_checker_plus: ^2.7.2
  talker_dio_logger: ^4.7.7
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3
  encrypt: ^5.0.3
  talker_flutter: ^4.7.7
  fluttertoast: ^8.2.12
  intl: ^0.20.2
  flutter_spinkit: ^5.2.1
  flutter_staggered_animations: ^1.1.1
  cached_network_image: ^3.4.1
  skeletonizer: ^1.4.3
  flutter_svg: ^2.1.0
  freezed_annotation: ^3.0.0
  go_router: ^15.1.2
  build_runner: ^2.4.15
  injectable: ^2.5.0
  flutter_gen_runner: ^5.10.0
  dotted_border: ^2.1.0
  auto_size_text: ^3.0.0
  blur: ^4.0.2
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true

  assets:
     - assets/images/photos/
     - assets/images/svg/
     - assets/images/test/
     - assets/fonts/poppins/
     - assets/fonts/inter/


  fonts:
     - family: poppins
       fonts:
         - asset: assets/fonts/poppins/Poppins-Thin.ttf
           weight: 100
         - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
           weight: 200
         - asset: assets/fonts/poppins/Poppins-Light.ttf
           weight: 300
         - asset: assets/fonts/poppins/Poppins-Regular.ttf
           weight: 400
         - asset: assets/fonts/poppins/Poppins-Medium.ttf
           weight: 500
         - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
           weight: 600
         - asset: assets/fonts/poppins/Poppins-Bold.ttf
           weight: 700
         - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
           weight: 800

     - family: inter
       fonts:
         - asset: assets/fonts/inter/Inter-Medium.ttf
           weight: 500
flutter_gen:
  output: lib/gen/
  assets:
    enabled: true
  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true