<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ahmed Emad Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ahmed Emad Portfolio">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ahmed Emad Portfolio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
  }

  #splash {
    position: absolute;
    top: 0;
    left: 0;
    height: 100vh;
    width: 100vw;
    background: radial-gradient(39.69% 61.07% at 50% 50%, #4A4A4A 0%, #212121 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    color: white;
  }

  #splash img {
    width: 100px;
    opacity: 0.1;
  }

  #splash h1 {
    margin: 20px 0 0;
    font-size: 28px;
    font-weight: bold;
  }

  #splash p {
    margin: 5px 0 0;
    font-size: 18px;
  }
</style>

<div id="splash">
  <img src="icons/apple-touch-icon.png" alt="Background" />
  <h1>Ahmed Emad</h1>
  <p>Flutter Developer</p>
</div>

<script>
  // Remove splash screen after Flutter app loads
  window.addEventListener('flutter-first-frame', function () {
    document.getElementById('splash')?.remove();
  });
</script>

<script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
